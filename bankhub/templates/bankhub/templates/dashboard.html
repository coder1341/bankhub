<!DOCTYPE html>
<html>
<head>
    <title>BankHub Dashboard</title>
</head>
<body>

<h1>BankHub Dashboard</h1>

{% if user.is_authenticated %}
    <h2>Welcome, {{ user.username }}</h2>

    {% if wallet %}
        <h3>Balance: ₦{{ wallet.balance }}</h3>
    {% endif %}

{% else %}
    <h2>Please log in</h2>
{% endif %}

</body>
</html>
