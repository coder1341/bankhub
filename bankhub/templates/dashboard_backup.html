<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>BankHub Mobile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f5f7fb;
padding:15px;
}

.top-card{
background:linear-gradient(135deg,#0047ff,#0033cc);
color:white;
border-radius:30px;
padding:20px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.profile-row{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.avatar{
width:60px;
height:60px;
border-radius:50%;
background:white;
color:#0047ff;
font-size:30px;
font-weight:bold;
display:flex;
align-items:center;
justify-content:center;
}

.balance-title{
font-size:18px;
margin-top:15px;
}

.balance{
font-size:42px;
font-weight:bold;
margin-top:10px;
}

.account-box{
background:rgba(255,255,255,.15);
padding:15px;
border-radius:20px;
margin-top:25px;
}

.account-number{
font-size:24px;
font-weight:bold;
margin-top:8px;
}

.btn-row{
display:flex;
gap:10px;
margin-top:15px;
}

.btn{
flex:1;
border:none;
padding:12px;
border-radius:12px;
font-weight:bold;
cursor:pointer;
}

.white-btn{
background:white;
}

.blue-btn{
background:#0b2ea9;
color:white;
}

.section{
background:white;
padding:20px;
border-radius:25px;
margin-top:20px;
}

.section h2{
margin-bottom:10px;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:15px;
}

.action-card{
background:#eef3ff;
padding:25px;
border-radius:20px;
text-align:center;
text-decoration:none;
color:black;
font-weight:bold;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
display:flex;
justify-content:space-around;
padding:15px;
box-shadow:0 -5px 20px rgba(0,0,0,.1);
}

.bottom-nav a{
text-decoration:none;
color:#333;
font-size:14px;
}

</style>

</head>
<body>

<div class="top-card">

<div class="profile-row">

<div style="display:flex;align-items:center;gap:10px;">

<div class="avatar">
{{ wallet.user.username|slice:":1"|upper }}
</div>

<div>
<h3>{{ wallet.user.username }}</h3>
<p>Verified Account</p>
</div>

</div>

<div id="clock"></div>

</div>

<p class="balance-title">Available Balance</p>

<div class="balance">
${{ wallet.balance }}
</div>

<div class="account-box">

<p>Your Account Number</p>

<div class="account-number">
{{ wallet.account_number }}
</div>

<div class="btn-row">

<a href="{% url 'transactions' %}">
<button class="btn white-btn">
Transactions
</button>
</a>

<a href="{% url 'deposit' %}">
<button class="btn blue-btn">
Top Up
</button>
</a>

</div>

</div>

</div>

<div class="section">

<h2>What would you like to do today?</h2>

<div class="actions">

<a href="{% url 'deposit' %}" class="action-card">
Deposit
</a>

<a href="{% url 'transfer' %}" class="action-card">
Transfer
</a>

<a href="{% url 'withdraw' %}" class="action-card">
Withdraw
</a>

<a href="{% url 'transactions' %}" class="action-card">
History
</a>

</div>

</div>

<div class="bottom-nav">

<a href="{% url 'dashboard' %}">
🏠 Home
</a>

<a href="{% url 'transactions' %}">
📄 Transactions
</a>

<a href="{% url 'deposit' %}">
💳 Deposit
</a>

<a href="{% url 'transfer' %}">
🔄 Transfer
</a>

</div>

<script>

function updateClock(){

const now = new Date();

document.getElementById("clock").innerHTML =
now.toLocaleTimeString();

}

setInterval(updateClock,1000);

updateClock();

</script>

</body>
</html>
