<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transfer Funds</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:linear-gradient(135deg,#eef4ff,#f8fbff);
padding:20px;
}

.card{
max-width:650px;
margin:auto;
margin-top:40px;
background:white;
padding:30px;
border-radius:25px;
box-shadow:0 15px 35px rgba(10,73,255,.12);
}

.header{
background:linear-gradient(135deg,#0A49FF,#002B9A);
color:white;
padding:25px;
border-radius:20px;
text-align:center;
margin-bottom:25px;
}

.header h1{
font-size:32px;
}

input{
width:100%;
padding:20px;
font-size:18px;
border:2px solid #DDE5F0;
border-radius:15px;
margin-bottom:15px;
}

input:focus{
outline:none;
border-color:#0A49FF;
}

button{
width:100%;
padding:20px;
font-size:20px;
font-weight:bold;
border:none;
border-radius:15px;
background:linear-gradient(135deg,#0A49FF,#002B9A);
color:white;
cursor:pointer;
}

button:hover{
opacity:.95;
}

.info{
background:#EAF2FF;
padding:15px;
border-radius:12px;
margin-top:20px;
color:#002B9A;
}

</style>
</head>
<body>

<div class="card">

<div class="header">
<h1>💸 Transfer Funds</h1>
<p>Send money securely</p>
</div>

<form method="POST">

{% csrf_token %}

<input
type="text"
name="account_number"
placeholder="Recipient Account Number"
required>

<input
type="number"
name="amount"
placeholder="Enter Transfer Amount"
required>

<button type="submit">
Transfer Money
</button>

</form>

<div class="info">
🔒 Transfers are protected by BankHub security systems.
</div>

</div>

</body>
</html>
