<!DOCTYPE html>
<html>
<head>
    <title>Upload Profile Photo</title>
</head>
<body>

<h1>Upload Profile Photo</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <input type="file" name="photo" required>

    <br><br>

    <button type="submit">
        Upload Photo
    </button>
</form>

</body>
</html>
